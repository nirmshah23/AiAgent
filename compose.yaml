services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - voice-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U voice -d voice]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://voice:${POSTGRES_PASSWORD}@db:5432/voice
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://voice:${POSTGRES_PASSWORD}@db:5432/voice
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: ./apps/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  voice-data:
